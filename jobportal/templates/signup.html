{% extends 'base.html' %} {% block content %}

<div
  style="
    max-width: 400px;
    margin: auto;
    margin-top: 40px;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px #ccc;
  "
>
  <h2 style="text-align: center">Signup</h2>

  <!-- Messages -->
  {% if messages %} {% for message in messages %}
  <p style="color: red; text-align: center">{{ message }}</p>
  {% endfor %} {% endif %}

  <form method="POST">
    {% csrf_token %}

    <input
      type="text"
      name="name"
      placeholder="Name"
      required
      style="width: 100%; padding: 10px"
    /><br /><br />

    <input
      type="email"
      name="email"
      placeholder="Email"
      required
      style="width: 100%; padding: 10px"
    /><br /><br />

    <input
      type="password"
      name="password"
      placeholder="Password"
      required
      style="width: 100%; padding: 10px"
    /><br /><br />

    <select name="role" style="width: 100%; padding: 10px">
      <option value="jobseeker">Job Seeker</option>
      <option value="recruiter">Recruiter</option></select
    ><br /><br />

    <button
      style="
        width: 100%;
        padding: 10px;
        background: #0a66c2;
        color: white;
        border: none;
      "
    >
      Signup
    </button>
  </form>

  <p style="text-align: center; margin-top: 10px">
    Already have an account? <a href="/login/">Login</a>
  </p>
</div>

{% endblock %}
