{% extends 'base.html' %} {% block content %}

<div style="max-width: 500px; margin: auto; margin-top: 50px">
  <h2 style="text-align: center">⚙️ Settings</h2>

  <form method="POST">
    {% csrf_token %}

    <label>Change Password</label>
    <input
      type="password"
      name="password"
      placeholder="New Password"
      style="width: 100%; padding: 10px; margin: 10px 0"
    />

    <button
      type="submit"
      style="width: 100%; padding: 10px; background: #dc3545; color: white"
    >
      Update Settings
    </button>
  </form>
</div>

{% endblock %}
