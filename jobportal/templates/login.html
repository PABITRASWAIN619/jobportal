{% extends 'base.html' %} {% block content %}

<style>
  /* ===== FULL BACKGROUND ===== */
  body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d")
      no-repeat center center/cover;

    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* DARK OVERLAY */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
  }

  /* ===== FLOATING GLASS FORM ===== */
  .glass {
    position: relative;
    width: 380px;
    padding: 30px;

    border-radius: 20px;
    backdrop-filter: blur(20px);

    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

    color: white;
    text-align: center;

    animation: pop 0.7s ease;
    z-index: 2;

    transition: 0.3s;
  }

  /* FLOAT ANIMATION */
  @keyframes pop {
    from {
      opacity: 0;
      transform: translateY(40px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* HOVER EFFECT (CENTER FLOAT) */
  .glass:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }

  /* TITLE */
  .glass h2 {
    margin-bottom: 20px;
    font-size: 26px;
    background: linear-gradient(90deg, #ff6a00, #ee0979, #00c6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* INPUT */
  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border: none;
    border-radius: 10px;

    outline: none;
    font-size: 14px;

    background: rgba(255, 255, 255, 0.85);
  }

  /* PASSWORD */
  .input-group {
    position: relative;
  }

  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #333;
  }

  /* BUTTON */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;

    font-weight: bold;
    cursor: pointer;

    color: white;

    background: linear-gradient(135deg, #ff512f, #dd2476, #24c6dc);

    box-shadow: 0 8px 20px rgba(255, 0, 150, 0.4);

    transition: 0.3s;
  }

  /* BUTTON HOVER */
  .btn:hover {
    transform: scale(1.05);
    background: linear-gradient(135deg, #24c6dc, #514a9d, #ff512f);
  }

  /* REMEMBER */
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin: 10px 0;
  }

  /* LINKS */
  a {
    color: #00c6ff;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  /* MOBILE */
  @media (max-width: 500px) {
    .glass {
      width: 90%;
    }
  }
</style>

<div class="glass">
  <h2>🔐 Welcome Back</h2>

  <form method="POST" onsubmit="showLoader()">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Enter email" required />

    <div class="input-group">
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter password"
        required
      />
      <span class="toggle-eye" onclick="togglePassword()">👁️</span>
    </div>

    <div class="remember">
      <input type="checkbox" name="remember_me" />
      <label>Remember me</label>
    </div>

    <button class="btn">
      <span id="btnText">Login</span>
      <span id="spinner" style="display: none">Loading...</span>
    </button>
  </form>

  <p style="margin-top: 15px">
    Don't have account? <a href="/signup/">Signup</a>
  </p>

  <p>
    <a href="/send-otp/">Login with OTP</a>
  </p>
</div>

<script>
  function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
  }

  function showLoader() {
    document.getElementById("btnText").style.display = "none";
    document.getElementById("spinner").style.display = "inline";
  }
</script>

{% endblock %}
