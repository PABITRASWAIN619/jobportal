{% extends 'base.html' %} {% block content %}

<div
  style="
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
  "
>
  <h2>Login</h2>

  {% if error %}
  <p style="color: red">{{ error }}</p>
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <input
      type="email"
      name="email"
      placeholder="Email"
      required
      style="width: 100%; padding: 10px"
    /><br /><br />
    <input
      type="password"
      name="password"
      placeholder="Password"
      required
      style="width: 100%; padding: 10px"
    /><br /><br />

    <button
      style="width: 100%; padding: 10px; background: #0a66c2; color: white"
    >
      Login
    </button>
  </form>
</div>

{% endblock %}
