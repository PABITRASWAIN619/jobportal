{% load static %}
<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0a66c2, #004182);
        color: white;
      }

      /* Navbar */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.3);
      }

      .navbar a {
        color: white;
        margin-left: 15px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .navbar a:hover {
        color: #ffd700;
      }

      /* Container */
      .container {
        text-align: center;
        margin-top: 60px;
        animation: fadeIn 1s ease;
      }

      /* Cards */
      .cards {
        display: flex;
        justify-content: center;
        margin-top: 40px;
        gap: 20px;
        flex-wrap: wrap;
      }

      .card {
        background: white;
        color: black;
        padding: 20px;
        width: 260px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.05);
      }

      .card a {
        display: inline-block;
        margin-top: 10px;
        padding: 8px 15px;
        background: #0a66c2;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }

      .card a:hover {
        background: #004182;
      }

      /* Animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <div class="navbar">
      <h2>Job Portal</h2>
      <div>
        <a href="/jobs/">Jobs</a>
        <a href="/post-job/">Post Job</a>
        <a href="/logout/">Logout</a>
      </div>
    </div>

    <!-- Dashboard Content -->
    <div class="container">
      <h1>Welcome to Dashboard 👋</h1>
      <p>Manage jobs, applications, and your profile</p>

      <div class="cards">
        <div class="card">
          <h3>View Jobs</h3>
          <p>Browse all available jobs</p>
          <a href="/jobs/">Go</a>
        </div>

        <div class="card">
          <h3>Apply Jobs</h3>
          <p>Apply for your dream job</p>
          <a href="/jobs/">Apply</a>
        </div>

        <div class="card">
          <h3>Post Job</h3>
          <p>Recruiters can post jobs</p>
          <a href="/post-job/">Post</a>
        </div>
      </div>
    </div>
  </body>
</html>
