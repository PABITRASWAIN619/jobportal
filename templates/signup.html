{% extends 'base.html' %} {% block content %}

<style>
  /* ===== MULTI IMAGE BACKGROUND SLIDESHOW ===== */
  body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background-size: cover;
    background-position: center;
    animation: bgSlide 16s infinite;
  }

  /* BACKGROUND IMAGES ANIMATION */
  @keyframes bgSlide {
    0% {
      background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
    }
    25% {
      background-image: url("https://images.unsplash.com/photo-1522071820081-009f0129c71c");
    }
    50% {
      background-image: url("https://images.unsplash.com/photo-1504384308090-c894fdcc538d");
    }
    75% {
      background-image: url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
    }
    100% {
      background-image: url("https://images.unsplash.com/photo-1522071820081-009f0129c71c");
    }
  }

  /* DARK OVERLAY */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
  }

  /* ===== GLASS CARD ===== */
  .container {
    position: relative;
    z-index: 2;
  }

  .glass {
    width: 380px;
    padding: 30px;

    border-radius: 20px;
    backdrop-filter: blur(20px);

    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

    color: white;
    text-align: center;

    animation: floatUp 0.7s ease;
    transition: 0.3s;
  }

  /* FLOAT ANIMATION */
  @keyframes floatUp {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* HOVER EFFECT */
  .glass:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  }

  /* TITLE */
  .glass h2 {
    margin-bottom: 20px;
    font-size: 26px;
    background: linear-gradient(90deg, #00c6ff, #ff6a00, #ee0979);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* INPUT + SELECT */
  input,
  select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border: none;
    border-radius: 10px;

    outline: none;
    font-size: 14px;
  }

  /* BUTTON */
  .btn {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 10px;

    cursor: pointer;
    font-weight: bold;
    color: white;

    background: linear-gradient(135deg, #ff512f, #dd2476, #24c6dc);

    box-shadow: 0 8px 20px rgba(255, 0, 150, 0.4);

    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.05);
  }

  /* LINKS */
  a {
    color: #00c6ff;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  /* MOBILE */
  @media (max-width: 500px) {
    .glass {
      width: 90%;
    }
  }
</style>

<div class="container">
  <div class="glass">
    <h2>🧑‍💻 Create Account</h2>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="name" placeholder="Username" required />

      <input type="email" name="email" placeholder="Enter Email" required />

      <input
        type="password"
        name="password"
        placeholder="Password (min 6 chars)"
        required
      />

      <select name="role" required>
        <option value="">Select Role</option>
        <option value="jobseeker">Job Seeker</option>
        <option value="recruiter">Recruiter</option>
      </select>

      <button class="btn">Sign Up</button>
    </form>

    <p style="margin-top: 15px">
      Already have account? <a href="/login/">Login</a>
    </p>
  </div>
</div>

{% endblock %}
