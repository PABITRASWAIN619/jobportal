{% extends 'base.html' %} {% block content %}

<style>
  /* ================= GLOBAL ================= */
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }

  /* ================= LAYOUT ================= */
  .container {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 20px;
    flex-wrap: wrap;
  }

  /* ================= PROFILE CARD ================= */
  .card {
    width: 320px;
    background: #111827;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    color: white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  .card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
  }

  .profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #3b82f6;
  }

  .name {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
  }

  .email {
    color: #9ca3af;
    font-size: 14px;
  }

  /* ================= FORM CARD ================= */
  .form-card {
    width: 420px;
    background: #111827;
    padding: 25px;
    border-radius: 18px;
    color: white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #1f2937;
    color: white;
    outline: none;
  }

  input:focus {
    border-color: #3b82f6;
  }

  /* DROP ZONE */
  .drop-zone {
    border: 2px dashed #3b82f6;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
    background: #1f2937;
    color: #9ca3af;
    transition: 0.3s;
  }

  .drop-zone:hover {
    background: #374151;
    color: white;
  }

  /* PREVIEW */
  .preview {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin-top: 10px;
    display: none;
    object-fit: cover;
  }

  /* BUTTONS */
  .btn {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #2ad01e);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.03);
  }
  /* ===== BACK BUTTON ===== */
  .back-btn {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #d57e33, #aa14cb);
    transition: all 0.3s ease;
  }

  /* Hover Effect */
  .back-btn:hover {
    background: linear-gradient(135deg, #695047, #c912d6);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
  }

  /* Click effect */
  .back-btn:active {
    transform: scale(0.97);
  }

  /* ================= MOBILE ================= */
  @media (max-width: 768px) {
    .container {
      flex-direction: column;
      align-items: center;
    }

    .form-card,
    .card {
      width: 100%;
      max-width: 400px;
    }
  }
</style>

<!-- ================= MAIN ================= -->
<div class="container">
  <!-- PROFILE CARD -->
  <div class="card">
    {% if request.user.profile.profile_pic %}
    <img
      src="{{ request.user.profile.profile_pic.url }}"
      class="profile-img"
      id="avatar"
    />
    {% else %}
    <img
      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      class="profile-img"
      id="avatar"
    />
    {% endif %}

    <div class="name">{{ request.user.first_name }}</div>
    <div class="email">{{ request.user.email }}</div>
  </div>

  <!-- FORM CARD -->
  <div class="form-card">
    <h3>✏ Update Profile</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <input type="text" name="name" value="{{ request.user.first_name }}" />
      <input type="email" name="email" value="{{ request.user.email }}" />

      <div class="drop-zone" onclick="document.getElementById('file').click()">
        📂 Click to Upload Profile Image
      </div>

      <input type="file" name="profile_pic" id="file" hidden />

      <img id="preview" class="preview" />

      <!-- SAVE BUTTON -->
      <button class="btn">Save Changes</button>

      <!-- BACK BUTTON -->
      <a href="{% url 'home' %}" class="back-btn">⬅ Back to Home</a>
    </form>
  </div>
</div>

<!-- ================= JS ================= -->
<script>
  const file = document.getElementById("file");
  const preview = document.getElementById("preview");
  const avatar = document.getElementById("avatar");

  file.addEventListener("change", function () {
    const reader = new FileReader();
    reader.onload = function (e) {
      preview.src = e.target.result;
      preview.style.display = "block";
      avatar.src = e.target.result;
    };
    reader.readAsDataURL(file.files[0]);
  });
</script>

{% endblock %}
