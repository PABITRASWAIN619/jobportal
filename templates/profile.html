{% extends 'base.html' %} {% block content %}

<style>
  /* ================= GLOBAL ================= */
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
  }

  /* ================= NAVBAR ================= */
  .navbar {
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    padding: 14px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .navbar a {
    color: white;
    text-decoration: none;
    margin-left: 12px;
    padding: 8px 14px;
    border-radius: 10px;
    transition: 0.3s;
    font-weight: 500;
  }

  .navbar a:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  /* ================= LAYOUT ================= */
  .container {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
    flex-wrap: wrap;
  }

  /* ================= PROFILE CARD ================= */
  .card {
    width: 340px;
    background: white;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  .card:hover {
    transform: translateY(-5px);
    transition: 0.3s;
  }

  /* PROFILE IMAGE */
  .profile-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #2563eb;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
  }

  /* TEXT */
  .name {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
  }

  .email {
    color: gray;
    font-size: 14px;
  }

  /* BUTTON */
  .btn {
    margin-top: 15px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  .btn:hover {
    transform: scale(1.03);
  }

  /* ================= FORM CARD ================= */
  .form-card {
    width: 420px;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    outline: none;
  }

  input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 8px rgba(37, 99, 235, 0.2);
  }

  /* DROP ZONE */
  .drop-zone {
    border: 2px dashed #2563eb;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 10px;
    background-color: blue;
    color: red;
  }

  .drop-zone:hover {
    background: #b6c20c;
  }

  /* PREVIEW */
  .preview {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin-top: 10px;
    display: none;
    object-fit: cover;
  }
</style>

<!-- ================= MAIN ================= -->
<div class="container">
  <!-- PROFILE CARD -->
  <div class="card">
    {% if request.user.profile.profile_pic %}
    <img
      src="{{ request.user.profile.profile_pic.url }}"
      class="profile-img"
      id="avatar"
    />
    {% else %}
    <img
      src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
      class="profile-img"
      id="avatar"
    />
    {% endif %}

    <div class="name">{{ request.user.first_name }}</div>
    <div class="email">{{ request.user.email }}</div>

    <button class="btn">👤 My Profile</button>
  </div>

  <!-- FORM CARD -->
  <div class="form-card">
    <h3>✏ Update Profile</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <input type="text" name="name" value="{{ request.user.first_name }}" />
      <input type="email" name="email" value="{{ request.user.email }}" />

      <div class="drop-zone" onclick="document.getElementById('file').click()">
        📂 Click or Drop Image Here
      </div>

      <input type="file" name="profile_pic" id="file" hidden />

      <img id="preview" class="preview" />

      <button class="btn">Save Changes</button>
    </form>
  </div>
</div>

<!-- ================= JS ================= -->
<script>
  const file = document.getElementById("file");
  const preview = document.getElementById("preview");
  const avatar = document.getElementById("avatar");

  file.addEventListener("change", function () {
    const reader = new FileReader();
    reader.onload = function (e) {
      preview.src = e.target.result;
      preview.style.display = "block";
      avatar.src = e.target.result;
    };
    reader.readAsDataURL(file.files[0]);
  });
</script>

{% endblock %}
