{% extends 'base.html' %} {% block content %}

<div class="section">
  <h2>👥 All Users</h2>

  <table>
    <tr>
      <th>Name</th>
      <th>Email</th>
    </tr>

    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.email }}</td>
    </tr>
    {% endfor %}
  </table>
</div>

{% endblock %}
