{% extends 'base.html' %} {% block content %}

<div
  style="
    max-width: 600px;
    margin: auto;
    margin-top: 50px;
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
  "
>
  <h2 style="color: white">Reply to {{ msg.user.username }}</h2>

  <p style="color: #94a3b8">{{ msg.message }}</p>

  <form method="POST">
    {% csrf_token %}

    <textarea
      name="reply"
      rows="5"
      style="width: 100%; padding: 10px"
    ></textarea>

    <button
      type="submit"
      style="
        margin-top: 10px;
        background: #22c55e;
        padding: 10px;
        width: 100%;
        color: white;
      "
    >
      Send Reply
    </button>
  </form>
</div>

{% endblock %}
