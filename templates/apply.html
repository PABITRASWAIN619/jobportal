{% extends 'base.html' %} {% block content %}

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a; /* ONLY COLOR BACKGROUND */
    color: #111;
  }

  .apply-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .apply-container {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
  }

  .job-box {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }

  .job-box h3 {
    margin: 0;
    color: #0a66c2;
  }

  .job-box p {
    margin: 5px 0;
    color: #444;
    font-size: 14px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
    font-size: 14px;
  }

  input,
  textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
  }

  input[type="file"] {
    background: #fff;
    cursor: pointer;
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    background: #0a66c2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #084a91;
  }

  .msg {
    background: #d1fae5;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  /* ================= MOBILE ================= */
  @media (max-width: 600px) {
    .apply-container {
      padding: 18px;
    }

    .job-box p {
      font-size: 13px;
    }
  }
</style>

<div class="apply-wrapper">
  <div class="apply-container">
    <!-- JOB DETAILS -->
    <div class="job-box">
      <h3>{{ job.title }}</h3>
      <p><b>Company:</b> {{ job.company }}</p>
      <p><b>Location:</b> {{ job.location }}</p>
      <p>{{ job.description }}</p>
    </div>

    <!-- MESSAGES -->
    {% if messages %} {% for message in messages %}
    <div class="msg">{{ message }}</div>
    {% endfor %} {% endif %}

    <!-- APPLY FORM -->
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label>LinkedIn Profile</label>
      <input
        type="url"
        name="linkedin"
        placeholder="https://linkedin.com/in/yourprofile"
      />

      <label>Upload Resume</label>
      <input type="file" name="resume" required />

      <button type="submit">Apply Now 🚀</button>
    </form>
  </div>
</div>

{% endblock %}
