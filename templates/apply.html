{% extends 'base.html' %} {% block content %}

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
      linear-gradient(rgba(10, 102, 194, 0.8), rgba(10, 102, 194, 0.8)),
      url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d");
    background-size: cover;
    background-position: center;
  }

  .apply-container {
    max-width: 520px;
    margin: 60px auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }

  .job-box {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
  }

  .job-box h3 {
    margin: 0;
    color: #0a66c2;
  }

  .job-box p {
    margin: 5px 0;
    color: #444;
  }

  label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
  }

  input,
  textarea {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
  }

  input[type="file"] {
    background: #fff;
    cursor: pointer;
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    background: #0a66c2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #084a91;
  }

  .msg {
    background: #d1fae5;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
</style>

<div class="apply-container">
  <!-- JOB DETAILS -->
  <div class="job-box">
    <h3>{{ job.title }}</h3>
    <p><b>Company:</b> {{ job.company }}</p>
    <p><b>Location:</b> {{ job.location }}</p>
    <p>{{ job.description }}</p>
  </div>

  <!-- SUCCESS / ERROR MESSAGES -->
  {% if messages %} {% for message in messages %}
  <div class="msg">{{ message }}</div>
  {% endfor %} {% endif %}

  <!-- APPLY FORM -->
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="url" name="linkedin" placeholder="LinkedIn Profile URL" />

    <input type="file" name="resume" required />

    <button type="submit">Apply Now 🚀</button>
  </form>

  {% endblock %}
</div>
